  <style><br>
    *{margin:0;padding:0;box-sizing:border-box}<br>
    body{<br>
      width:100vw;height:100vh;overflow:hidden;<br>
      background:linear-gradient(135deg,#fce4ec,#f8bbd0);<br>
      font-family:<q>PingFang SC</q>,<q>Microsoft YaHei</q>,sans-serif;<br>
      display:flex;justify-content:center;align-items:center;<br>
      position:relative;<br>

    .petals{<br>
      position:absolute;top:0;left:0;width:100%;height:100%;<br>
      pointer-events:none;z-index:0;<br>
    }<br>
    .envelope-btn{<br>
      width:200px;height:200px;background:#fff0f5;<br>
      border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,0.1);<br>
      display:flex;flex-direction:column;justify-content:center;align-items:center;<br>
      cursor:pointer;z-index:10;font-size:60px;transition:transform 0.3s;<br>
    }<br>
    .envelope-btn:active{transform:scale(0.95)}<br>
    .envelope-text{margin-top:8px;font-size:18px;color:#d81b60;letter-spacing:2px}<br>
    .card{<br>
      display:none;flex-direction:column;align-items:center;text-align:center;<br>
      z-index:10;animation:fadeInUp 1s ease;<br>
    }<br>
    .card h1{<br>
      font-size:42px;color:#c2185b;margin-bottom:20px;<br>
      text-shadow:2px 2px 4px rgba(0,0,0,0.1);<br>
    }<br>
    .card .message{<br>
      font-size:20px;color:#ad1457;background:rgba(255,255,255,0.7);<br>
      padding:20px 30px;border-radius:20px;margin:10px 0;<br>
      backdrop-filter:blur(10px);max-width:280px;<br>
    }<br>
    .card .footer{font-size:16px;color:#880e4f;margin-top:30px;opacity:0.8}<br>
    @keyframes fadeInUp{<br>
      from{opacity:0;transform:translateY(40px)}<br>
      to{opacity:1;transform:translateY(0)}<br>
    }<br>
    .petal{<br>
      position:absolute;font-size:30px;animation:fall linear forwards;<br>
      pointer-events:none;<br>
    }<br>
    @keyframes fall{<br>
      0%{transform:translateY(-10vh) rotate(0deg);opacity:1}<br>
      100%{transform:translateY(110vh) rotate(360deg);opacity:0}<br>
    }<br>

  <div class="petals" id="petalsContainer"></div><br>

  </div><br>
  <div class="card" id="card"><br>

      var customMessage = document.getElementById(&#39;customMessage&#39;);</p>

<pre><code>  customMessage.innerHTML = &#39;谢谢你做我的妈妈&lt;br&gt;是我这辈子最大的幸运&lt;br&gt;愿你永远健康、美丽&#39;;
